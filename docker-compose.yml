services:

  # ─── CHOICE_A Load Balancer ──────────────────────────────────────────
  lb:
    build: .
    container_name: choice-a-lb
    ports:
      - "8090:80"
      - "2200:22"
    volumes:
      - .:/app
      - ./nginx/lb-default.conf:/etc/nginx/sites-available/default:ro
    working_dir: /app
    depends_on:
      - web
    restart: always
    command: >
      bash -c "
        echo 'CHOICE_A LB: waiting for web backend...' &&
        until curl -s --connect-timeout 2 web:80 &>/dev/null; do
          echo '  still waiting...'; sleep 2;
        done &&
        echo 'CHOICE_A LB: web backend reachable, starting nginx...' &&
        rm -f /etc/nginx/sites-enabled/default &&
        ln -s /etc/nginx/sites-available/default /etc/nginx/sites-enabled/default &&
        /usr/sbin/sshd &&
        nginx -g 'daemon off;'
      "

  # ─── Web Server ──────────────────────────────────────────────────────
  web:
    build: .
    container_name: web-server
    ports:
      - "8080:80"
      - "2222:22"
    volumes:
      - .:/app
    working_dir: /app
    depends_on:
      - db
    command: >
      bash -c "
        /usr/sbin/sshd &&
        nginx -g 'daemon off;'
      "

  # ─── MySQL Database ──────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Hello@123
      MYSQL_DATABASE: PRAVE_Vinuth-db
    ports:
      - "3307:3306"

  # ─── phpMyAdmin ──────────────────────────────────────────────────────
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: phpmyadmin
    restart: always
    ports:
      - "8088:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: Hello@123
    depends_on:
      - db
