services:

  web:
    build: .
    container_name: web-server
    ports:
      - "8080:80"
      - "2222:22"
    volumes:
      - .:/app
    working_dir: /app
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Hello@123
      MYSQL_DATABASE: PRAVE_Vinuth-db
    ports:
      - "3307:3306"