# CHOICE_A Load Balancer — nginx reverse proxy
# Balances traffic to backend web servers

# Use Docker's internal DNS resolver for dynamic hostname resolution
resolver 127.0.0.11 valid=30s ipv6=off;

upstream backend_web {
    # Web server instances (identical machines, same virtual IP)
    server web:80 weight=1 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Health check endpoint
    location /health {
        return 200 '{"status":"ok","role":"CHOICE_A-load-balancer"}';
        add_header Content-Type application/json;
    }

    # Proxy all traffic to backend web servers
    location / {
        proxy_pass http://backend_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Load-Balancer CHOICE_A;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
