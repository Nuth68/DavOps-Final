# CHOICE_A Load Balancer — nginx reverse proxy
# Balances traffic to backend web servers (identical machines, same virtual IP)

upstream backend_web {
    server web:80 weight=1 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # LB's own landing page
    location / {
        return 200 'Hello World Server 2';
        add_header Content-Type text/plain;
    }

    location /health {
        return 200 '{"status":"ok","role":"CHOICE_A-load-balancer"}';
        add_header Content-Type application/json;
    }

    # Proxy API/backend requests to web servers
    location /app {
        proxy_pass http://backend_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Load-Balancer CHOICE_A;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
