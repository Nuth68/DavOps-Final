[web_servers]
web-server ansible_host=host.docker.internal ansible_port=2222 ansible_user=root ansible_password=root

# CHOICE_A Load Balancer — identical to web-server, same virtual IP
# Website: localhost:8090 | SSH: port 2200
[load_balancers]
choice-a-lb ansible_host=host.docker.internal ansible_port=2200 ansible_user=root ansible_password=root

# Mac host — Ansible SSHes into the Mac to run docker commands there
[mac_host]
mac ansible_host=host.docker.internal ansible_port=22 ansible_user=mac ansible_password=1111

[all:vars]
ansible_python_interpreter=/usr/bin/python3
